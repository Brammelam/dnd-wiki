expires -1;

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;

location /assets/ {
    expires 1y;
}

location /fonts/ {
    expires 7d;
}

location ~ ^/party-banner-(640|1280|1916)\.(jpg|webp)$ {
    expires 7d;
}

location = /favicon.svg {
    expires 1d;
}

location = /vp-icons.css {
    expires 1d;
}
