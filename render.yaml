services:
  - type: web
    name: dnd-wiki
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: .vitepress/dist
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /fonts/*
        name: Cache-Control
        value: public, max-age=604800
      - path: /party-banner-*
        name: Cache-Control
        value: public, max-age=604800
      - path: /favicon.svg
        name: Cache-Control
        value: public, max-age=86400
      - path: /vp-icons.css
        name: Cache-Control
        value: public, max-age=86400
